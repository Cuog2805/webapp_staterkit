# Kiểm tra mỗi PR và mỗi push lên main. Workflow Deploy cũng gọi lại file này
# (workflow_call) để không bao giờ deploy code chưa qua kiểm tra.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test api/api.slnx

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^TUNNEL_TOKEN=.*/TUNNEL_TOKEN=ci/' .env
          docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.tunnel.yml config --quiet
      - name: Validate Caddyfiles
        run: |
          for f in Caddyfile Caddyfile.tunnel; do
            docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" -e DOMAIN=example.com -e ACME_EMAIL=ci@example.com \
              caddy:2.10-alpine caddy validate --config "/etc/caddy/$f" --adapter caddyfile
          done
      - name: Shellcheck
        run: shellcheck deploy/scripts/*.sh deploy/mysql-init/*.sh

  # Build thử image (không push) để bắt lỗi Dockerfile ngay ở PR.
  docker-build:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: web, context: my-app }
          - { name: api, context: api }
          - { name: migrate, context: db }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
