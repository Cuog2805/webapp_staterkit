services:
  mysql:
    image: mysql:8.4
    container_name: webapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chạy migration SQL (db/migrations) khi khởi động. Flyway tự tạo bảng
  # flyway_schema_history để theo dõi migration nào đã áp dụng.
  flyway:
    image: flyway/flyway:11
    container_name: webapp-flyway
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - -url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
      - -user=${MYSQL_USER}
      - -password=${MYSQL_PASSWORD}
      - -locations=filesystem:/flyway/sql
      - -connectRetries=10
      - migrate
    volumes:
      - ./migrations:/flyway/sql

volumes:
  mysql-data:
